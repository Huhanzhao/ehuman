spring:
  application:
    name: ai-helper-user
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:ai-helper-user.yml
      - optional:nacos:ai-helper-user-${spring.profiles.active}.yml
  datasource:
    url: jdbc:mysql://localhost:3306/AI_SERVICE?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      port: 6379
      host: localhost
      password:
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: ai-helper
        group: DEFAULT_GROUP
      config:
        server-addr: localhost:8848
        namespace: ai-helper
        group: DEFAULT_GROUP
        file-extension: yml
server:
  port: 8082
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    com.baomidou.mybatisplus: debug

