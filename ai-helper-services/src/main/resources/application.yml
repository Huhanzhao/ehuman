spring:
  datasource:
    url: jdbc:mysql://localhost:3306/qq_bot?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: ai-helper-services
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:ai-helper-services.yml
      - optional:nacos:ai-helper-services-${spring.profiles.active}.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: ai-helper
        group: DEFAULT_GROUP
      config:
        server-addr: localhost:8848
        namespace: ai-helper
        group: DEFAULT_GROUP
        file-extension: yml
  ai:
    anthropic:
      api-key: sdfs
    openai:
      api-key: dsg
server:
  port: 8081
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

