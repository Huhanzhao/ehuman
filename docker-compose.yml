version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: AI_SERVICE  # 自动创建一个数据库
#      MYSQL_USER: demo
#      MYSQL_PASSWORD: demo123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      # 添加napcat

  redis:
    image: redis:7.0
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ai-bot-service:
    build:
      context: ./ai-bot-service
      dockerfile: Dockerfile
    container_name: ai-bot-service
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - redis
      - mysql

volumes:
  mysql_data:
  redis_data:
