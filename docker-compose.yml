# 启动前先设置宿主机数据目录，例如（Git Bash / Linux / macOS）：
#   export DATA_PATH=/d/ehuman-data        # 或 DATA_PATH=D:/ehuman-data
#   docker compose up -d
# PowerShell：
#   $env:DATA_PATH="D:/ehuman-data"; docker compose up -d
# 也可以直接写在同目录的 .env 文件里：DATA_PATH=D:/ehuman-data
services:

  ai-bot-service:
    build:
      context: .                              # 必须是项目根目录，emoji/md/sqlite 在根目录下
      dockerfile: ehuman-core/Dockerfile
    image: ehuman
    container_name: ehuman
    restart: always
    depends_on:
      - napcat
    ports:
      - "8081:8081"
    volumes:
      # 三个目录都要映射：容器内按 ./emoji/ ./md/ ./sqlite/ 相对路径读取
      - type: bind
        source: ${DATA_PATH:?请先设置宿主机数据目录，例如 DATA_PATH=D:/ehuman-data}/emoji
        target: /app/emoji
      - type: bind
        source: ${DATA_PATH}/md
        target: /app/md
      - type: bind
        source: ${DATA_PATH}/sqlite
        target: /app/sqlite

  napcat:
    image: mlikiowa/napcat-docker:4.14.7
    container_name: napcat
    restart: always
    ports:
      - "3000:3000"      # HTTP API
      - "3001:3001"      # WebSocket
      - "16099:6099"     # WebUI
    volumes:
      # 【重要】持久化目录，避免每次重启重新登录
      - type: bind
        source: ${DATA_PATH:?请先设置宿主机数据目录，例如 DATA_PATH=D:/ehuman-data}/napcat/config
        target: /app/napcat/config
